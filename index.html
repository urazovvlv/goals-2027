<!DOCTYPE html>
<html lang="uz">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0c171c; --tx:#f2f6f7; --mut:rgba(226,236,239,.55); --acc:#6fa3b0; --acc2:#b9dbe3; --ok:#8fb9c3; --warn:#f2d58a; --bad:#ff6b6b;
  --glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
  --glass-b:rgba(255,255,255,.11);
  --rim:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(255,255,255,.22);
  --well:inset 0 2px 6px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.06);

  --glow:0 0 22px rgba(150,196,208,.45); --r:24px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";letter-spacing:-.1px}
body{padding-bottom:calc(104px + var(--sab));min-height:100vh;background:transparent;position:relative;z-index:0}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:rgba(0,0,0,.28);border:1px solid var(--glass-b);border-radius:16px;padding:12px 14px;width:100%;outline:none;color-scheme:dark;box-shadow:var(--well)}
input:focus,select:focus,textarea:focus{border-color:rgba(160,205,215,.7);box-shadow:var(--well),0 0 0 3px rgba(150,196,208,.15)}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + var(--sat)) 14px 16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:30px;margin:0;font-weight:600;letter-spacing:-.8px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
.top .sub{color:var(--mut);font-size:13px}
.glass,.card,.goal,.icon-btn,.datenav button,nav.tabs,.chip,.stepper button,.toggle,.btn.ghost,.week .c,.stat div{
  background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--rim),0 10px 30px -12px rgba(0,0,0,.6);

.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}

.card.hero{overflow:hidden;padding:18px 16px 54px;border:1px solid rgba(255,255,255,.14);background:
  radial-gradient(120% 55% at 50% 112%,rgba(220,240,244,.95) 0%,rgba(150,196,208,.9) 22%,rgba(110,160,175,.45) 42%,rgba(60,95,105,.12) 62%,transparent 75%),
  radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px) 0 0/12px 12px,

nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sab));max-width:536px;margin:0 auto;border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:5;
  background:linear-gradient(180deg,rgba(38,56,63,.62),rgba(14,25,30,.72));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(255,255,255,.28),0 14px 40px rgba(0,0,0,.55)}
nav.tabs button{min-height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);transition:.2s}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:#fff;background:rgba(0,0,0,.42);box-shadow:var(--well)}
nav.tabs button.on svg{color:var(--acc2);filter:drop-shadow(0 0 6px rgba(150,196,208,.9))}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:21;padding:16px 16px calc(20px + var(--sab));border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:radial-gradient(100% 40% at 50% 0%,rgba(150,196,208,.14),transparent 70%),linear-gradient(180deg,rgba(36,54,61,.82),rgba(12,22,27,.92));border-top:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -10px 40px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%)}
.sheet:not(.open){visibility:hidden;transition:transform .28s,visibility 0s .28s}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet h2{margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:-.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.log{font-size:13px}
.log .hrow{min-height:40px}
.x{width:36px;height:36px;border-radius:50%;color:var(--mut)}
.cp{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.cp:first-of-type{border-top:0}
.cp .dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);box-shadow:var(--well);flex:none;display:grid;place-items:center;font-size:14px;margin-top:2px}
.cp.done .dot{background:linear-gradient(180deg,#8fb9c3,#3f636c);border-color:rgba(200,230,236,.6);color:#fff;box-shadow:var(--glow)}
.cp.late .dot{border-color:var(--warn)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{border-radius:16px;padding:12px;box-shadow:var(--rim)}
.stat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.5px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:linear-gradient(180deg,rgba(40,60,68,.85),rgba(16,28,33,.9));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 -1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.star{color:var(--acc2);text-shadow:0 0 8px rgba(150,196,208,.8)}
svg text{fill:var(--mut);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.gtile{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;text-align:left;padding:0;display:block;width:100%;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--rim),0 12px 30px -14px rgba(0,0,0,.7)}
.gtile .img{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .4s}
.gtile:active .img{transform:scale(1.04)}
.gtile .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(5,12,15,.55) 62%,rgba(5,12,15,.92) 100%)}
.gtile .noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;opacity:.55;padding-bottom:40px}
.gtile .noimg small{display:block;font-size:11px;text-align:center;margin-top:4px;opacity:.9}
.gtile .info{position:absolute;left:0;right:0;bottom:0;padding:10px 11px 11px}
.gtile .tt{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.gtile .pc{position:absolute;top:9px;right:9px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gtile .st{position:absolute;top:8px;left:10px;font-size:16px}
.gtile .bar{margin-top:7px;height:4px;background:rgba(255,255,255,.18)}
.gtile.done{border-color:rgba(200,230,236,.7);box-shadow:var(--rim),0 0 22px rgba(150,196,208,.45)}
.gimg{width:100%;aspect-ratio:1/1;border-radius:22px;background-size:cover;background-position:center;border:1px solid var(--glass-b);box-shadow:var(--rim);margin:10px 0}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.intro{min-height:calc(100vh - 40px - var(--sat));display:flex;flex-direction:column;justify-content:center;padding:20px 6px 30px;animation:fadeUp .5s ease both}
.intro .q{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;font-size:31px;line-height:1.18;font-weight:600;letter-spacing:-.9px;margin:14px 0 28px}
.intro .pct{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:32px;padding:18px 20px;margin-bottom:14px}
.intro .pct input{background:transparent;border:0;box-shadow:none;width:150px;text-align:right;font-size:64px;font-weight:600;letter-spacing:-2px;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
.intro .pct input:focus{box-shadow:none}
.intro .pct span{font-size:44px;font-weight:500;color:var(--mut)}
.intro .quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:22px}
.intro .quick .chip{justify-content:center;padding:0;font-size:14px}
.intro .err{color:#ffb3b3;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .45s ease both}

</style>

<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const BUILD = '1.6.0';
const OWNER_ID = 5020539876; // faqat shu Telegram foydalanuvchisi kira oladi
const YEAR = 2027;
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const can = v => { try { return inTG && tg.isVersionAtLeast(v); } catch(e){ return false; } };

/* ---------- self-update (Telegram caches hard) ---------- */
(function(){
  try{
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
      if(!j||!j.build||j.build===BUILD) return;
      const k='g27_reload_'+j.build;
      if(sessionStorage.getItem(k)) return;
      sessionStorage.setItem(k,'1');
      location.replace(location.pathname+'?v='+j.build+location.hash);
    }).catch(()=>{});
  }catch(e){}
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const uid = () => Math.random().toString(36).slice(2,9);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const fmt = n => { n=Number(n)||0; return (Math.round(n*10)/10).toLocaleString('ru-RU').replace(/,/g,'.').replace(/ /g,' '); };
const OYLAR = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const OY3 = ['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const HAFTA = ['Yak','Du','Se','Chor','Pay','Ju','Sha'];
const HAFTA_FULL = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const prettyDate = s => { const d=parse(s); return d.getDate()+'-'+OYLAR[d.getMonth()]+(d.getFullYear()!==YEAR?' '+d.getFullYear():''); };
const haptic = (t='light') => { try{ if(!inTG) return; if(t==='ok') tg.HapticFeedback.notificationOccurred('success'); else if(t==='err') tg.HapticFeedback.notificationOccurred('error'); else if(t==='sel') tg.HapticFeedback.selectionChanged(); else tg.HapticFeedback.impactOccurred(t);}catch(e){} };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function confirmBox(msg){ return new Promise(res=>{ if(can('6.2')){ try{ tg.showConfirm(msg,ok=>res(!!ok)); return; }catch(e){} } res(window.confirm(msg)); }); }

/* ---------- storage: CloudStorage + localStorage, chunked docs ---------- */
const LS = 'g27_';
const CHUNK = 3500;
const Cloud = {
  ok: () => can('6.9') && !!tg.CloudStorage,
  call(fn, ...args){ return new Promise((res,rej)=>{ try{ tg.CloudStorage[fn](...args,(err,val)=>err?rej(err):res(val)); }catch(e){ rej(e); } }); },
  keys(){ return this.call('getKeys'); },
  getMany(keys){ return keys.length?this.call('getItems',keys):Promise.resolve({}); },
  set(k,v){ return this.call('setItem',k,v); },
  removeMany(keys){ return keys.length?this.call('removeItems',keys):Promise.resolve(true); }
};
const Store = {
  docs:{},            // name -> object
  parts:{},           // name -> number of cloud parts last written
  timers:{},
  q: Promise.resolve(),
  local(name){ try{ const s=localStorage.getItem(LS+name); return s?JSON.parse(s):null; }catch(e){ return null; } },
  async loadAll(){
    // local first
    const names=new Set();
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(LS)&&!k.startsWith(LS+'reload')) names.add(k.slice(LS.length)); }
    names.forEach(n=>{ const v=this.local(n); if(v) this.docs[n]=v; });
    if(!Cloud.ok()) return;
    try{
      const keys=await Cloud.keys();
      if(!keys||!keys.length){ // first run in cloud: push local docs up
        Object.keys(this.docs).forEach(n=>this.push(n)); return;
      }
      const vals={}; for(let i=0;i<keys.length;i+=80) Object.assign(vals, await Cloud.getMany(keys.slice(i,i+80)));
      const grouped={};
      keys.forEach(k=>{ const m=k.match(/^(.+)_(n|\d+)$/); if(!m) return; (grouped[m[1]]=grouped[m[1]]||{})[m[2]]=vals[k]; });
      Object.entries(grouped).forEach(([name,g])=>{
        const n=parseInt(g.n,10); if(!n) return;
        let s=''; for(let i=0;i<n;i++){ if(g[i]==null) return; s+=g[i]; }
        let obj; try{ obj=JSON.parse(s); }catch(e){ return; }
        this.parts[name]=n;
        const loc=this.docs[name];
        if(!loc || (obj._ts||0) > (loc._ts||0)){ this.docs[name]=obj; try{ localStorage.setItem(LS+name,s); }catch(e){} }
        else if((loc._ts||0) > (obj._ts||0)) this.push(name);
      });
      Object.keys(this.docs).forEach(n=>{ if(!grouped[n]) this.push(n); });
    }catch(e){ console.warn('cloud load',e); }
  },
  get(name, def){ if(!this.docs[name]) this.docs[name]=def(); return this.docs[name]; },
  save(name){
    const d=this.docs[name]; if(!d) return;
    d._ts=Date.now();
    try{ localStorage.setItem(LS+name,JSON.stringify(d)); }catch(e){}
    clearTimeout(this.timers[name]);
    this.timers[name]=setTimeout(()=>this.push(name),700);
  },
  push(name){
    if(!Cloud.ok()) return;
    this.q=this.q.then(async()=>{
      const d=this.docs[name]; if(!d) return;
      const s=JSON.stringify(d);
      const n=Math.max(1,Math.ceil(s.length/CHUNK));
      for(let attempt=0;attempt<3;attempt++){
        try{
          for(let i=0;i<n;i++) await Cloud.set(name+'_'+i, s.slice(i*CHUNK,(i+1)*CHUNK));
          await Cloud.set(name+'_n', String(n));
          const old=this.parts[name]||0;
          if(old>n){ const rm=[]; for(let i=n;i<old;i++) rm.push(name+'_'+i); await Cloud.removeMany(rm); }
          this.parts[name]=n; return;
        }catch(e){ await new Promise(r=>setTimeout(r,800*(attempt+1))); }
      }
    });
  },
  remove(name){
    delete this.docs[name]; try{ localStorage.removeItem(LS+name); }catch(e){}
    clearTimeout(this.timers[name]);
    if(!Cloud.ok()) return;
    this.q=this.q.then(async()=>{ try{ const n=this.parts[name]||0; const rm=[name+'_n']; for(let i=0;i<Math.max(n,40);i++) rm.push(name+'_'+i); await Cloud.removeMany(rm); delete this.parts[name]; }catch(e){} });
  },
  async resetAll(){
    Object.keys(localStorage).filter(k=>k.startsWith(LS)).forEach(k=>localStorage.removeItem(k));
    this.docs={}; this.parts={};
    if(Cloud.ok()){ await this.q; const keys=await Cloud.keys(); for(let i=0;i<keys.length;i+=50) await Cloud.removeMany(keys.slice(i,i+50)); }
  }
};

function yearStats(year=YEAR){
  const st={namoz5:0,juma:0,gym:0,pg:0,q:0,h:0,e:0,prayers:0};
  eachDay(year,(s,d)=>{
    const sum=(d.p||[]).reduce((a,b)=>a+(b?1:0),0); st.prayers+=sum;
    if(sum===5) st.namoz5++; if(d.j) st.juma++; if(d.g) st.gym++;
    st.pg+=+d.pg||0; st.q+=+d.q||0; st.h+=+d.h||0; st.e+=+d.e||0;
  });
  const c=core();
  st.books=c.books.filter(b=>b.done&&b.done.startsWith(String(year))).length;
  st.yasin=c.memo.yasin||0; st.mulk=c.memo.mulk||0; st.asmo=c.memo.asmo||0;
  return st;
}
function goalVal(g, st){
  if(g.type==='auto') return st[g.metric]||0;
  if(g.type==='num'){ const l=(g.log||[]); return l.length?+l[l.length-1].v:+g.start||0; }
  if(g.type==='steps') return g.steps.filter(x=>x.d).length;
  return g.done?1:0;
}
function goalPct(g, st){
  const v=goalVal(g,st);
  if(g.type==='bin') return g.done?100:0;
  if(g.type==='steps') return g.steps.length?Math.round(v/g.steps.length*100):0;
  const s=g.type==='num'?(+g.start||0):0, t=+g.target||0;
  if(t===s) return v>=t?100:0;
  return clamp(Math.round((v-s)/(t-s)*100),0,100);
}
function goalText(g, st){
  const v=goalVal(g,st);
  if(g.type==='bin') return g.done?'Bajarildi ✓':'Hali bajarilmagan';
  if(g.type==='steps') return v+' / '+g.steps.length+' qadam';
  if(g.type==='auto') return fmt(v)+' / '+fmt(g.target)+' '+AUTO[g.metric].unit;
  const u=g.unit||''; const pre=u==='$'?'$':''; const post=u&&u!=='$'?' '+u:'';
  let s=pre+fmt(v)+post+' → '+pre+fmt(g.target)+post;
  if(g.monthly){ const l=g.log||[]; if(l.length) s+=' · '+monthLabel(l[l.length-1].d); }
  return s;
}
const monthLabel = s => { const d=parse(s.length===7?s+'-01':s); return OYLAR[d.getMonth()]+' '+d.getFullYear(); };

  const ys=points.map(p=>p.y).concat(plan.map(p=>p.y)); let mn=Math.min(...ys), mx=Math.max(...ys);
  if(opts.min!=null) mn=Math.min(mn,opts.min); if(opts.max!=null) mx=Math.max(mx,opts.max);
  if(mx===mn){ mx+=1; mn-=1; }
  const X=x=>L+x*(W-L-R), Y=y=>T+(1-(y-mn)/(mx-mn))*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${L-4}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`; }
  [0,3,6,9].forEach(m=>{ g+=`<text x="${X(m/12)}" y="${H-6}">${OY3[m]}</text>`; });
  if(plan.length) g+=`<polyline fill="none" stroke="#7f979c" stroke-dasharray="4 4" stroke-width="1.5" points="${plan.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
  if(points.length){ g+=`<polyline fill="none" stroke="#8fb9c3" stroke-width="2.5" style="filter:drop-shadow(0 0 4px rgba(150,196,208,.8))" stroke-linejoin="round" points="${points.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`; points.forEach(p=>{ g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="#d6ecf1"/>`; }); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label||'grafik')}">${g}</svg>`;
}
const yearFrac = s => clamp(daysBetween(YEAR+'-01-01',s)/365,0,1);
function vRaqam(st){

  if(mg.length){

    const tgt=mg.reduce((a,g)=>a+(+g.target||0),0); const mx=Math.max(tgt,...rows.map(r=>r.tot),1);
    const cols=['#6fa3b0','#d6ecf1','#eef7f9'];
    const W=340,H=170,L=34,B=22,T=10; const bw=(W-L-6)/12;
    let g=''; for(let i=0;i<=4;i++){ const v=mx*i/4, y=T+(1-i/4)*(H-T-B); g+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${L-4}" y="${y+3}" text-anchor="end">${v>=1000?fmt(v/1000)+'k':fmt(v)}</text>`; }
    rows.forEach(r=>{ let y0=H-B; r.vals.forEach((v,i)=>{ const hh=v/mx*(H-T-B); if(hh>0){ g+=`<rect x="${L+r.m*bw+3}" y="${y0-hh}" width="${bw-6}" height="${hh}" rx="3" fill="${cols[i%3]}"/>`; y0-=hh; } }); g+=`<text x="${L+r.m*bw+bw/2}" y="${H-6}" text-anchor="middle">${OY3[r.m].slice(0,2)}</text>`; });
    const ty=T+(1-tgt/mx)*(H-T-B); g+=`<line x1="${L}" x2="${W-4}" y1="${ty}" y2="${ty}" stroke="#7f979c" stroke-dasharray="4 4"/>`;
    const lastTot=[...rows].reverse().find(r=>r.tot>0);
    h+=`<div class="card"><h3>Oylik daromad <small>${lastTot?'$'+fmt(lastTot.tot)+' · '+OYLAR[lastTot.m]:'hali yozilmagan'}</small></h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daromad grafigi">${g}</svg>
      <div class="legend">${mg.map((x,i)=>`<span><i style="background:${cols[i%3]}"></i>${esc(x.title.replace(/oylik|orqali|daromad/gi,'').trim()||x.title)}</span>`).join('')}<span><i style="background:#7f979c"></i>Maqsad $${fmt(tgt)}</span></div>
      <div class="chips" style="margin-top:10px">${mg.map(x=>`<button class="chip" data-act="goal" data-id="${x.id}">+ ${esc(x.title.split(' ')[0])}</button>`).join('')}</div></div>`;
  }
  // savings & other numeric
  const others=c.goals.filter(g=>g.type==='num'&&!g.weight&&!g.monthly);
  if(others.length) h+=`<div class="card"><h3>Boshqa raqamlar</h3>${others.map(g=>{const p=goalPct(g,st);return `<button class="hrow" style="width:100%;text-align:left" data-act="goal" data-id="${g.id}"><div class="grow"><div>${esc(g.title)}</div><div class="xs mut">${esc(goalText(g,st))}</div><div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div></div><div class="sm" style="margin-left:10px">${p}%</div></button>`;}).join('')}</div>`;
  // year stats
  h+=`<div class="card"><h3>2027 statistikasi</h3><div class="stat">
    <div><b>${st.namoz5}</b><span class="xs mut">5 mahal kunlar</span></div>
    <div><b>${st.juma}</b><span class="xs mut">juma namozi</span></div>
    <div><b>${st.gym}</b><span class="xs mut">zal mashg'uloti</span></div>

    <div><b>${fmt(Math.round(st.e/60*10)/10)}</b><span class="xs mut">soat IELTS</span></div>
  </div></div>`;
  return h;
}

function setStepper(k, v){ daySet(UI.date,d=>{ d[k]=Math.max(0,Math.round(v)||0); }); }
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.classList.contains('dnum')){ setStepper(el.dataset.k, +el.value); }
});
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){ UI.tab=b.dataset.tab; haptic('sel'); render(); window.scrollTo(0,0); return; }
  const a=b.dataset.act, c=core();
  const g = UI.cur && c.goals.find(x=>x.id===UI.cur);
  switch(a){
    case 'settings': settingsSheet(); break;
    case 'introq': { const inp=$('#inPct'); inp.value=b.dataset.v; $('#inErr').textContent=''; haptic('sel'); break; }
    case 'introgo': introSubmit(); break;
    case 'gimg': pickImage(); break;
    case 'gimgdel': { if(!g) break; if(!await confirmBox('Rasmni o\'chirasizmi?')) break; Store.remove('img_'+g.id); toast('Rasm o\'chirildi'); goalSheetRefresh(); break; }
    case 'dprev': UI.date=addDays(UI.date,-1); haptic('sel'); render(); break;
    case 'dnext': if(UI.date<today()){ UI.date=addDays(UI.date,1); haptic('sel'); render(); } break;
    case 'goday': UI.date=b.dataset.d; haptic('sel'); render(); break;
    case 'pray': daySet(UI.date,d=>{ const i=+b.dataset.i; d.p[i]=d.p[i]?0:1; if(d.p.every(Boolean)) setTimeout(()=>{haptic('ok');toast('5 mahal namoz ✓ Barakalla!');},50); }); haptic(); render(); break;
    case 'juma': daySet(UI.date,d=>{ d.j=d.j?0:1; }); haptic('ok'); render(); break;
    case 'gym': daySet(UI.date,d=>{ d.g=d.g?0:1; }); haptic(); render(); break;
    case 'inc': case 'dec': { const k=b.dataset.k, s=+b.dataset.s*(a==='inc'?1:-1); const d=dayGet(UI.date)||emptyDay(); setStepper(k,(+d[k]||0)+s); haptic(); render(); break; }
    case 'tab': UI.tab=b.dataset.t; render(); window.scrollTo(0,0); break;
    case 'tabclose': UI.tab=b.dataset.t; closeSheet(); break;
    case 'filter': UI.filter=b.dataset.f; haptic('sel'); render(); break;
    case 'goal': goalSheet(b.dataset.id); break;
    case 'newgoal': UI.cur=null; goalEdit(null,b.dataset.sec); break;
    case 'gedit': goalEdit(UI.cur); break;
    case 'tgl': b.classList.toggle('on'); haptic(); break;
    case 'gbin': if(g){ g.done=!g.done; Store.save('core'); haptic(g.done?'ok':'light'); if(g.done) toast('Barakalla! ✓'); goalSheetRefresh(); } break;
    case 'gstep': if(g){ const s=g.steps[+b.dataset.i]; s.d=!s.d; Store.save('core'); haptic(s.d?'ok':'light'); goalSheetRefresh(); } break;
    case 'gaddstep': if(g){ const v=$('#newStep').value.trim(); if(v){ g.steps.push({t:v,d:false}); Store.save('core'); goalSheetRefresh(); } } break;
    case 'glog': if(g){ let d=$('#lgD').value, v=parseFloat(String($('#lgV').value).replace(',','.')); if(!d||isNaN(v)){ haptic('err'); toast('Qiymatni kiriting'); break; }
      if(g.monthly) d=d.slice(0,7)+'-01';
      g.log=(g.log||[]).filter(l=>l.d!==d); g.log.push({d,v}); g.log.sort((x,y)=>x.d<y.d?-1:1); Store.save('core'); haptic('ok'); toast('Saqlandi'); goalSheetRefresh(); } break;
    case 'gdellog': if(g){ if(!await confirmBox('Bu yozuvni o\'chirasizmi?')) break; g.log=g.log.filter(l=>l.d!==b.dataset.d); Store.save('core'); goalSheetRefresh(); } break;
    case 'memo': { const inp=$('#memoV'); inp.value=Math.max(0,(+inp.value||0)+(+b.dataset.s)); haptic(); break; }
    case 'memoset': { const m=b.dataset.m; const gg=c.goals.find(x=>x.metric===m); let v=Math.max(0,Math.round(+$('#memoV').value||0)); if(gg) v=Math.min(v,+gg.target||v); c.memo[m]=v; Store.save('core'); haptic('ok'); toast('Saqlandi'); goalSheetRefresh(); break; }
    case 'gsave': {
      const id=b.dataset.id; const title=$('#eT').value.trim(); if(!title){ haptic('err'); toast('Nomini yozing'); break; }
      let x=id?c.goals.find(q=>q.id===id):null;
      if(!x){ const type=$('#eY')?$('#eY').value:'bin'; x={id:uid(),type,done:false,log:[],steps:[]}; c.goals.push(x); }
      x.title=title; x.sec=$('#eS').value; x.note=$('#eN').value.trim(); x.star=$('#eStar').classList.contains('on');
      if(x.type==='num'||x.type==='auto'){ const tv=parseFloat(String($('#eB').value).replace(',','.')); x.target=isNaN(tv)?0:tv; }
      if(x.type==='num'){ const sv=parseFloat(String($('#eA').value).replace(',','.')); x.start=isNaN(sv)?0:sv; x.unit=$('#eU').value.trim(); x.monthly=$('#eM').classList.contains('on'); if(!x.log) x.log=[]; }
      if(x.type==='steps'&&!x.steps) x.steps=[];
      Store.save('core'); haptic('ok'); UI.cur=x.id;
      while(UI.layers.length) { UI.layers.pop(); } $('#sheet').classList.remove('open'); $('#sheetBg').style.display='none'; render(); goalSheet(x.id); break; }
    case 'gdel': { if(!await confirmBox('Bu maqsadni butunlay o\'chirasizmi?')) break; Store.remove('img_'+b.dataset.id); c.goals=c.goals.filter(q=>q.id!==b.dataset.id); Store.save('core'); UI.cur=null; closeSheet(); toast('O\'chirildi'); break; }
    case 'cp': cpSheet(b.dataset.id); break;
    case 'newcp': cpSheet(null); break;
    case 'cpdone': { const x=c.cps.find(q=>q.id===b.dataset.id); x.done=!x.done; Store.save('core'); haptic(x.done?'ok':'light'); closeSheet(); if(x.done) toast('Barakalla! ✓'); break; }
    case 'cpsave': { const t=$('#cT').value.trim(), d=$('#cD').value; if(!t||!d){ haptic('err'); toast('Sana va nomini yozing'); break; } let x=b.dataset.id?c.cps.find(q=>q.id===b.dataset.id):null; if(!x){ x={id:uid(),done:false}; c.cps.push(x); } x.t=t; x.d=d; x.n=$('#cN').value.trim(); Store.save('core'); haptic('ok'); closeSheet(); break; }
    case 'cpdel': { if(!await confirmBox('O\'chirasizmi?')) break; c.cps=c.cps.filter(q=>q.id!==b.dataset.id); Store.save('core'); closeSheet(); break; }
    case 'book': bookSheet(b.dataset.id); break;
    case 'newbook': bookSheet(null); break;
    case 'bsave': { const t=$('#bT').value.trim(); if(!t){ haptic('err'); break; } let x=b.dataset.id?c.books.find(q=>q.id===b.dataset.id):null; if(!x){ x={id:uid(),done:''}; c.books.push(x); } x.t=t; Store.save('core'); haptic('ok'); closeSheet(); break; }
    case 'bdone': { const x=c.books.find(q=>q.id===b.dataset.id); x.done=x.done?'':today(); Store.save('core'); haptic(x.done?'ok':'light'); closeSheet(); if(x.done) toast('Yana bitta kitob ✓'); break; }
    case 'bdel': { if(!await confirmBox('O\'chirasizmi?')) break; c.books=c.books.filter(q=>q.id!==b.dataset.id); Store.save('core'); closeSheet(); break; }
    case 'import': {
      let arr; try{ arr=JSON.parse($('#impT').value); }catch(err){ haptic('err'); toast('JSON xato'); break; }
      if(!Array.isArray(arr)) arr=arr&&arr.goals?arr.goals:[arr];
      let n=0; arr.forEach(o=>{ if(!o||!o.title) return; const type=['bin','num','steps'].includes(o.type)?o.type:'bin';
        const x={id:uid(),sec:SECTIONS.find(s=>s.id===o.sec)?o.sec:'oila',title:String(o.title).slice(0,120),star:!!o.star,type,done:false,note:String(o.note||'').slice(0,300)};
        if(type==='num'){ x.start=+o.start||0; x.target=+o.target||0; x.unit=String(o.unit||'').slice(0,8); x.monthly=!!o.monthly; x.log=[]; }
        if(type==='steps'){ x.steps=(o.steps||[]).map(t=>({t:String(t).slice(0,120),d:false})); }
        c.goals.push(x); n++; });
      Store.save('core'); haptic('ok'); toast(n+' ta maqsad qo\'shildi'); closeSheet(); break; }
    case 'export': { const all={}; Object.entries(Store.docs).forEach(([k,v])=>all[k]=v); const s=JSON.stringify(all); try{ await navigator.clipboard.writeText(s); toast('Nusxalandi'); }catch(err){ $('#impT').value=s; toast('Matnni qo\'lda nusxalang'); } break; }
    case 'reset': { if(!await confirmBox('Barcha ma\'lumotlar (maqsadlar, kundalik belgilar) butunlay o\'chadi. Davom etasizmi?')) break; await Store.resetAll(); UI.layers=[]; $('#sheet').classList.remove('open'); $('#sheetBg').style.display='none'; core(); Store.save('core'); render(); toast('Tozalandi'); break; }
  }
});
function pickImage(){
  const id=UI.cur; if(!id) return;
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    try{
      toast('Rasm tayyorlanmoqda…');
      const data=await squareImage(f, 420, 0.72);
      Store.docs['img_'+id]={data}; Store.save('img_'+id);
      haptic('ok'); toast('Rasm qo\'yildi'); if(UI.cur===id&&UI.layers.length) goalSheetRefresh(); else render();
    }catch(e){ haptic('err'); toast('Rasmni ochib bo\'lmadi'); }
  };
  inp.click();
}
function squareImage(file, size, q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ try{
      const s=Math.min(im.naturalWidth,im.naturalHeight); const sx=(im.naturalWidth-s)/2, sy=(im.naturalHeight-s)/2;
      const cv=document.createElement('canvas'); cv.width=cv.height=size; const cx=cv.getContext('2d');
      cx.imageSmoothingQuality='high'; cx.drawImage(im,sx,sy,s,s,0,0,size,size);
      let d=cv.toDataURL('image/jpeg',q); if(d.length>70000) d=cv.toDataURL('image/jpeg',0.55);
      URL.revokeObjectURL(url); res(d);
    }catch(e){ rej(e); } };
    im.onerror=e=>{ URL.revokeObjectURL(url); rej(e); };
    im.src=url;
  });
}
function goalSheetRefresh(){ const id=UI.cur; UI.layers.pop(); goalSheet(id); }
$('#sheetBg').addEventListener('click', ()=>closeSheet());


/* ---------- intro question on every open ---------- */
const INTRO_Q = "Agar o'tgan yili bor potensialingni ishlatganingda yillik maqsadlaringning qanchasiga erishgan bo'lar eding?";
function showIntro(){
  UI.intro=true;
  $('#tabs').style.display='none';
  const c=core(); const last=(c.answers||[]).slice(-1)[0];
  $('#app').innerHTML=`<div class="intro">
    <div><span class="pill">Kirishdan oldin</span></div>
    <div class="q">${esc(INTRO_Q)}</div>
    <div class="pct glass"><input id="inPct" inputmode="numeric" maxlength="3" placeholder="0" aria-label="Foiz" autocomplete="off"><span>%</span></div>
    <div class="quick">${[50,70,80,90,100].map(v=>`<button class="chip" data-act="introq" data-v="${v}">${v}%</button>`).join('')}</div>
    <div class="err" id="inErr"></div>
    <button class="btn" data-act="introgo">Ilovaga kirish</button>
    ${last?`<div class="xs mut" style="text-align:center;margin-top:14px">Oxirgi javobing: ${last.v}% · ${prettyDate(last.d)}</div>`:''}
  </div>`;
  const inp=$('#inPct');
  inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,3); $('#inErr').textContent=''; });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); introSubmit(); } });
}
function introSubmit(){
  const raw=$('#inPct').value.trim(); const v=parseInt(raw,10);
  if(raw===''||isNaN(v)||v<0||v>100){ $('#inErr').textContent='0 dan 100 gacha son yoz'; haptic('err'); return; }
  const c=core(); c.answers=c.answers||[]; c.answers.push({d:today(),v,t:Date.now()});
  if(c.answers.length>500) c.answers=c.answers.slice(-500);
  Store.save('core'); haptic('ok');
  try{ document.activeElement&&document.activeElement.blur(); }catch(e){}
  UI.intro=false;
  $('#tabs').style.display='';
  render();
  $('#app').classList.add('fade-in'); setTimeout(()=>$('#app').classList.remove('fade-in'),500);
}

/* ---------- boot ---------- */
async function boot(){
  if(inTG){
    try{ tg.expand(); }catch(e){}
    try{ if(can('6.1')){ tg.setHeaderColor('#0c171c'); tg.setBackgroundColor('#0c171c'); } if(can('7.10')) tg.setBottomBarColor('#0c171c'); }catch(e){}
    try{ if(can('6.1')) tg.BackButton.onClick(onBack); }catch(e){}
    try{ if(can('7.0')){ tg.SettingsButton.show(); tg.SettingsButton.onClick(()=>{ if(!UI.layers.length&&!UI.intro) settingsSheet(); }); } }catch(e){}
  }
  const me = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user ? Number(tg.initDataUnsafe.user.id) : 0;
  if(me !== OWNER_ID){
    $('#tabs').style.display='none';
    document.body.style.paddingBottom='0';
    $('#app').innerHTML=`<div class="card hero" style="margin-top:22vh;text-align:center;padding:28px 20px 70px"><div style="font-size:40px">🔒</div><div class="big" style="font-size:26px;margin-top:8px">Shaxsiy ilova</div><div class="sm" style="color:#d6ecf1;margin-top:8px">Bu ilova faqat egasi uchun.</div></div>`;
    try{ if(inTG){ tg.BackButton.hide(); tg.SettingsButton.hide(); tg.ready(); } }catch(e){}
    return;
  }
  $('#app').innerHTML='<div class="empty" style="padding-top:40vh">Yuklanmoqda…</div>';
  await Store.loadAll();
  if(!Store.docs.core){ core(); Store.save('core'); }
  // migrate: ensure fields
  const c=core(); c.books=c.books||[]; c.memo=c.memo||{yasin:0,mulk:0,asmo:0}; c.cps=c.cps||[]; c.answers=c.answers||[];
  showIntro();
  try{ if(inTG) tg.ready(); }catch(e){}
  // refresh "today" when app resumes on a new day
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&UI.tab==='bugun'&&!UI.layers.length){ render(); } });
}
boot();
</script>
